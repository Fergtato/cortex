services:
  web:
    build:
      context: .
      args:
        # Optional: bake your Supabase URL + anon (public) key into the build so
        # the app defaults to Supabase. Set them in a .env file next to this
        # file. Leave unset to configure them in Settings → data source instead.
        # Never put the service-role key here — it would ship to every browser.
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:80"
    restart: unless-stopped
