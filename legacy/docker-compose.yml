# Local build of the Cortex web app. On TrueNAS, use the prebuilt image from
# GitHub Container Registry instead — see docs/truenas-deploy.md.
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # Read at container start (no rebuild needed to change them). Set them
      # in a .env file next to this file. Public values only — never the
      # service-role key.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    restart: unless-stopped
