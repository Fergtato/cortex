server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change: cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Runtime config and the HTML shell must always be fresh, so an updated
  # container (new asset hashes / new config) takes effect on next load.
  location = /env-config.js {
    add_header Cache-Control "no-store";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: fall back to index.html for any unknown path.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
